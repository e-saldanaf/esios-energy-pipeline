version: 2

sources:
  - name: esios_raw
    description: >
      Raw landing zone for ESIOS/REE API indicator values.
      Populated by the Python extract layer (extract/main.py).
      Never consumed directly by BI — dbt staging is the contract.
    schema: raw
    database: postgres

    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: extracted_at

    tables:
      - name: esios_indicator_values
        description: >
          Long-format table with one row per (indicator, datetime, geography).
          All ESIOS indicators share this single table — adding a new indicator
          requires zero DDL changes.
        columns:
          - name: indicator_id
            description: ESIOS indicator ID. Registry in extract/config.py.
            tests:
              - not_null
          - name: datetime_utc
            description: Observation timestamp, always stored in UTC.
            tests:
              - not_null
          - name: geo_id
            description: Geography ID. 3 = España peninsular.
            tests:
              - not_null
          - name: value
            description: Indicator value. Nullable — ESIOS can publish nulls.
          - name: extracted_at
            description: Timestamp of first load. Used for source freshness.
            tests:
              - not_null
          - name: updated_at
            description: Timestamp of last MERGE update. Captures ESIOS revisions.